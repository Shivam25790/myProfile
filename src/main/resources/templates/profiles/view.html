<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${profile.name} + ' - Profile'">Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<h1 th:text="${profile.name}"></h1>
<p><strong>Email:</strong> <span th:text="${profile.email}"></span></p>
<p><strong>Bio:</strong> <span th:text="${profile.bio}"></span></p>
<p><strong>Skills:</strong> <span th:text="${profile.skills}"></span></p>
<p><a th:href="${profile.linkedin}" th:text="${profile.linkedin}"></a></p>
<p><a th:href="${profile.github}" th:text="${profile.github}"></a></p>
<a th:href="@{/profiles}">Back</a>
</body>
</html>
