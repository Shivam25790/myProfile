<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Profiles</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<h1>Profiles</h1>
<a th:href="@{/profiles/new}">Create Profile</a>
<table>
    <thead><tr><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
    <tbody>
    <tr th:each="p : ${profiles}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.email}"></td>
        <td>
            <a th:href="@{|/profiles/${p.id}|}">View</a>
            <a th:href="@{|/profiles/${p.id}/edit|}">Edit</a>
            <form th:action="@{|/profiles/${p.id}/delete|}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
